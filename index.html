<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Argon2id Login</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js"></script></head><body><main class="card"><h1>Argon2id Authentication</h1><p class="sub">Register and login with Argon2id. Credentials are stored locally as an Argon2id encoded hash.</p><section id="registerBox"><h2>Register</h2><input id="regUser" placeholder="Username" autocomplete="username"><input id="regPass" type="password" placeholder="Password" autocomplete="new-password"><input id="regConfirm" type="password" placeholder="Confirm password" autocomplete="new-password"><button id="registerBtn">Create account</button><p id="regMsg" class="msg"></p></section><section id="loginBox"><h2>Login</h2><input id="loginUser" placeholder="Username" autocomplete="username"><input id="loginPass" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Login</button><p id="loginMsg" class="msg"></p></section><section id="welcome" class="hidden"><h2>Welcome, <span id="welcomeUser"></span>!</h2><p>You are logged in.</p><button id="logoutBtn" class="secondary">Logout</button></section><footer>Argon2id • localStorage • GitHub Pages ready</footer></main><script src="script.js"></script></body></html>
